# Zero-Intelligence (constrained) double auction baseline.
#
# Gode & Sunder (1993) ZI-C traders: each agent draws a random price
# inside its own viable range on every turn (buyers: [0, reservation];
# sellers: [reservation, u_high]). No LLM is invoked — this config is
# a pure stochastic baseline for comparison with LLM experiments.
#
# Pure-ZI runs use n_rounds=1: ZI agents do not observe history,
# so rounds are independent and a multi-round simulation is statistically
# equivalent to running more single-round simulations. We collect repeats
# via n_simulations instead, which keeps the output schema (one row per
# sim_id) consistent with LLM experiments and simplifies analysis.
experiment:
  n_rounds: 1
  # 300 ticks is about 2x headroom over the typical deadlock point for an
  # 11x11 Smith market (~140 ticks in practice). Low enough to keep runs
  # fast, high enough that deadlock detection — not the cap — ends
  # rounds in every observed ZI-C trajectory.
  max_ticks_per_round: 300
  # Bumped from 10 to 50 to preserve the original 10 sims x 5 rounds = 50
  # round-trajectories under the new 1-round-per-sim convention.
  n_simulations: 50
  random_seed: 42
  buyers:
    min: 0.75
    max: 3.25
    num: 11
    strategies: zi_c
  sellers:
    min: 0.75
    max: 3.25
    num: 11
    strategies: zi_c

# ZI sampling hyperparameters. u_high caps seller asks; u_low caps buyer
# bids from below. For ZI-C, accept/bid/announce probabilities are unused.
zi:
  u_low: 0.0
  u_high: 4.0

tracing:
  enabled: false
  llm_call_logging: false
