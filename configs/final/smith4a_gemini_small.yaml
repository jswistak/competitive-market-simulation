# Smith 4A (1962), Gemini, small model
experiment:
  include_reasoning: true
  n_rounds: 4
  n_iterations: 13
  n_simulations: 10
  buyers:
    min: 2.5
    max: 4.9
    num: 13
  sellers:
    min: 3.1
    max: 3.1
    num: 13

llm:
  provider: gemini
  model: gemini-3-flash-preview
  temperature: 1.0
  max_tokens: 1024
  max_retries: 3

tracing:
  enabled: true

prompts:
  general:
    main_template: |
      You are a {role} participating in a market for a good you need to {verb}. Your task is to {verb} a unit of the good at the {preference} possible price but not {condition} your reservation price.
      Your profit from a transaction equals the difference between {profit_formula}.
      Your goal is to maximize your profit.
      Your reservation price is known to you and only you.
      Under no condition can you {verb} {condition} your reservation price.

      There are {N_BUYERS} buyers and {N_SELLERS} sellers in this market (including you).
      Any buyer or seller is free at any time to announce an offer to buy or sell.
      Any buyer or seller is free to accept an offer, in which case a binding contract has been formed, the transaction occurs, and both parties exit the round (no longer permitted to act for the remainder of that round).

      There will be {N_ROUNDS} rounds.
      Each round, you want to {verb} an additional unit of the good and are able to transact irrespective of whether you transacted in the previous round.
      Each round, a maximum of {N_ITER} transactions can be made. You can only make one transaction per round.

      Your reservation price is ${reservation_price:.2f}.

      Market history:
      {market_history}

      History of your actions:
      {own_history}

      This is round {round}/{N_ROUNDS}.

      {action_prompt}

    announcement_history_template: |
      In round {round}, your offer to {announcement_type} for ${price:.2f} was {outcome}.

    response_history_template: |
      In round {round}, you {outcome} a {opposite_announcement_type} offer for ${price:.2f}.

  seller:
    main_keywords:
      role: seller
      verb: sell
      preference: highest
      condition: below
      profit_formula: your transaction price and your reservation price

    response_prompt: |
      Someone is offering to buy at ${price:.2f}. Do you accept this offer and sell at this price?


    announcement_prompt: |
      Do you want to announce an offer to sell? If so, what is your asking price?

  buyer:
    main_keywords:
      role: buyer
      verb: buy
      preference: lowest
      condition: above
      profit_formula: your reservation price and your transaction price

    response_prompt: |
      Someone is offering to sell at ${price:.2f}. Do you accept this offer and buy at this price?


    announcement_prompt: |
      Do you want to announce a bid to buy? If so, what is your bid price?
