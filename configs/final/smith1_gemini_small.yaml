# Smith 1 (1962), Gemini, small model — improvement-rule CDA.
#
# Updated from configs/smith1*.yaml for the new Gode & Sunder (1993)-
# faithful mechanism:
#   * max_ticks_per_round is required (no code default).
#   * The main_template now describes the order book and the
#     improvement rule, and surfaces {standing_bid} / {standing_ask}
#     so the LLM can see the current best outstanding prices.
#   * The announcement_prompt spells out the improvement-rule
#     constraint on the LLM's quoted price.
#   * response_prompt / response_history_template are unused by the
#     CDA path (crossing is automatic, no one is asked to accept);
#     they are retained for non-CDA fallback compat.
experiment:
  include_reasoning: true
  n_rounds: 5
  # One tick = one randomly-chosen active agent posts an order into
  # the central order book. 300 matches the ZI-C baseline's budget
  # so LLM-vs-ZI comparisons are apples-to-apples on max_ticks. In
  # practice ZI-C rounds end via deadlock around tick 140 on this
  # market; LLM rounds may use more or fewer ticks depending on
  # how aggressively the model quotes improving prices.
  max_ticks_per_round: 300
  n_simulations: 10
  buyers:
    min: 0.75
    max: 3.25
    num: 11
  sellers:
    min: 0.75
    max: 3.25
    num: 11

llm:
  provider: gemini
  model: gemini-3-flash-preview
  temperature: 1.0
  max_tokens: 1024
  max_retries: 3

tracing:
  enabled: true

prompts:
  general:
    main_template: |
      You are a {role} participating in a continuous double-auction market for a good you need to {verb}. Your task is to {verb} a unit of the good at the {preference} possible price without {verb}ing {condition} your reservation price.
      Your profit from a transaction equals the difference between {profit_formula}.
      Your goal is to maximize your profit.
      Your reservation price is known to you and only you.
      Under no condition can you {verb} {condition} your reservation price.

      There are {N_BUYERS} buyers and {N_SELLERS} sellers in this market (including you).

      Market rules (continuous double auction with order book):
      - The market maintains a standing best bid (the highest outstanding buy offer) and a standing best ask (the lowest outstanding sell offer). Either may be absent if no one has posted on that side yet.
      - To post a new bid, your price must be STRICTLY HIGHER than the current standing bid. To post a new ask, your price must be STRICTLY LOWER than the current standing ask. Non-improving orders are rejected by the exchange and have no effect on the market.
      - If your bid is greater than or equal to the standing ask (or your ask is less than or equal to the standing bid), a trade executes immediately at the earlier (standing) price. Both parties exit the round.
      - A round ends once no one can post an improving order, or once a cap on orders is reached.

      There will be {N_ROUNDS} rounds. Each round, you want to {verb} an additional unit of the good and are able to transact irrespective of whether you transacted in the previous round. You can only make one transaction per round.

      Your reservation price is ${reservation_price:.2f}.

      Current standing bid: {standing_bid}
      Current standing ask: {standing_ask}

      Market history:
      {market_history}

      History of your actions:
      {own_history}

      This is round {round}/{N_ROUNDS}.

      {action_prompt}

    announcement_history_template: |
      In round {round}, your offer to {announcement_type} for ${price:.2f} was {outcome}.

    response_history_template: |
      In round {round}, you {outcome} a {opposite_announcement_type} offer for ${price:.2f}.

  seller:
    main_keywords:
      role: seller
      verb: sell
      preference: highest
      condition: below
      profit_formula: your transaction price and your reservation price

    response_prompt: |
      Someone is offering to buy at ${price:.2f}. Do you accept this offer and sell at this price?

    announcement_prompt: |
      Do you want to announce an offer to sell? If so, what is your asking price? It must be strictly lower than the current standing ask (or be the first ask if none exists) and no lower than your reservation price.

  buyer:
    main_keywords:
      role: buyer
      verb: buy
      preference: lowest
      condition: above
      profit_formula: your reservation price and your transaction price

    response_prompt: |
      Someone is offering to sell at ${price:.2f}. Do you accept this offer and buy at this price?

    announcement_prompt: |
      Do you want to announce a bid to buy? If so, what is your bid price? It must be strictly higher than the current standing bid (or be the first bid if none exists) and no higher than your reservation price.
