# Zero-Intelligence (unconstrained) double auction baseline.
#
# Each agent ignores its reservation price and draws bids/asks
# uniformly from [zi.u_low, zi.u_high]. Accept/announce decisions
# are Bernoulli-gated. Serves as a pure-noise floor for LLM comparisons.
#
# Pure-ZI runs use n_rounds=1: ZI agents do not observe history, so
# rounds are independent and multi-round is statistically equivalent to
# more single-round sims. Repeats come from n_simulations, which keeps
# the output schema consistent with LLM experiments.
experiment:
  n_rounds: 1
  # ZI-U draws are often non-improving (discarded by the mechanism),
  # so a wider tick budget is needed to surface Q* transactions.
  max_ticks_per_round: 300
  # Bumped from 10 to 50 to preserve the original 10 sims x 5 rounds = 50
  # round-trajectories under the new 1-round-per-sim convention.
  n_simulations: 50
  random_seed: 42
  buyers:
    min: 0.8
    max: 3.2
    num: 11
    strategies: zi_u
  sellers:
    min: 0.8
    max: 3.2
    num: 11
    strategies: zi_u

zi:
  u_low: 0.0
  u_high: 4.0
  announce_prob: 0.5
  accept_prob: 0.5
  bid_prob: 0.5

tracing:
  enabled: false
  llm_call_logging: false
