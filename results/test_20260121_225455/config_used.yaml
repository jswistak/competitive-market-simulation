experiment:
  buyers:
    max: 2.0
    min: 1.0
    num: 3
  n_iterations: 3
  n_rounds: 1
  n_simulations: 1
  sellers:
    max: 2.0
    min: 1.0
    num: 3
llm:
  max_retries: 3
  max_tokens: 10
  model: gpt-4o-mini
  provider: openai
  retry_backoff_factor: 2.0
  retry_base_delay: 1.0
  temperature: 0.0
prompts:
  buyer:
    announcement_prompt: 'Do you want to announce a bid to buy? If so, what is your
      bid price? Answer only with a number.

      '
    main_keywords:
      condition: above
      preference: lowest
      role: buyer
      verb: buy
    response_prompt: 'Someone is offering to sell at ${price:.2f}. Do you buy? Only
      answer with a yes or no.

      '
  general:
    announcement_history_template: 'In round {round} at iteration {iteration}, your
      offer to {announcement_type} for ${price:.2f} was {outcome}.

      '
    main_template: 'You are a {role} participating in a market for a good you need
      to {verb}. Your task is to {verb} a unit of the good at the {preference} possible
      price but not {condition} your reservation price.

      Your reservation price is known to you and only you.

      Under no condition can you {verb} {condition} your reservation price.

      However, {verb}ing at a price equal to your reservation price is acceptable
      and preferred than not {verb}ing at all.


      There are 3 buyers and 3 sellers in the room (including you).

      Any buyer or seller is free at any time to raise his hand and make a verbal
      offer to buy/sell.

      Any buyer or seller is free to accept an offer, in which case a binding contract
      has been formed, the transaction occurs and the buyer and seller drop out of
      the market (no longer permitted to do anything for the remainder of that round).


      There will be {N_ROUNDS} rounds.

      Each round, you want to {verb} an additional unit of the good and are able to
      transact irrespective of whether you transacted in the previous round.

      Each round, a maximum of {N_ITER} transactions can be made. You can only make
      one transaction per round.


      Your reservation price is {reservation_price}.


      Market history:

      {market_history}


      History of your actions:

      {own_history}


      This is round {round}/{N_ROUNDS} iteration {iteration}/{N_ITER}.


      {action_prompt}

      '
    response_history_template: 'In round {round} at iteration {iteration}, you {outcome}
      an offer to {opposite_announcement_type} for ${price:.2f}.

      '
  seller:
    announcement_prompt: 'Do you want to announce an offer to sell? If so, what is
      your asking price? Answer only with a number.

      '
    main_keywords:
      condition: below
      preference: highest
      role: seller
      verb: sell
    response_prompt: 'Someone is offering to buy at ${price:.2f}. Do you sell? Only
      answer with a yes or no.

      '
tracing:
  enabled: true
  langfuse_host: https://cloud.langfuse.com
