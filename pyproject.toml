[project]
name = "competitive-market-simulation"
version = "0.1.0"
description = "Competitive Market Simulation - LangGraph-based market equilibrium simulation for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core LangGraph
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    # LLM Providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "openai>=1.50.0",
    "anthropic>=0.30.0",
    # Tracing
    "langfuse>=2.50.0",
    # Config & Utils
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    # Sandboxed code execution
    "e2b-code-interpreter>=1.0.0",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    "mypy>=1.19.1",
    "ruff>=0.14.13",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "pytest>=9.0.2",
]

[project.scripts]
market-simulation = "market_simulation.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_simulation"]
